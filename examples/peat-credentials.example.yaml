# =============================================================================
# PEAT SIEM credentials -- EXAMPLE
# =============================================================================
#
# This is an ordinary PEAT config file that holds ONLY the connection settings
# and secrets for the `peat forward` SIEM targets (Elastic/OpenSearch, Malcolm,
# Security Onion). Keep it small and separate so it is easy to gitignore.
#
# USAGE
#   1. Copy this file and drop the ".example" from the name:
#        cp examples/peat-credentials.example.yaml peat-credentials.yaml
#   2. Fill in the servers/credentials for the targets you use.
#   3. Pass it on a forward run with -c / --config-file:
#        peat -c peat-credentials.yaml forward ./peat_results/<run> --target security_onion
#
# The real `peat-credentials.yaml` (and .yml / .peat-credentials.yaml) is listed
# in .gitignore so it is never committed. Do NOT rename this ".example" file in
# place and add secrets to it -- copy it first.
#
# PRECEDENCE (highest wins):
#   CLI flag (e.g. --so-password)  >  PEAT_* env var  >  this config file
# A `user:pass@` already embedded in a *_server URL always wins over the
# matching *_user / *_password values below.
#
# TWO WAYS TO SUPPLY SECRETS
#   A) Inline (simplest): write the value directly. The file must stay
#      gitignored and readable only by you (chmod 600).
#   B) !ENV tag (best for shared/automated hosts): the value is read from an
#      environment variable AT LOAD TIME and never stored in the file. The
#      env var name is raw (no PEAT_ prefix). An optional default may be given
#      as the second list item:  !ENV ['SO_PASSWORD', '']
# -----------------------------------------------------------------------------

metadata:
  name: "peat-credentials"
  description: "SIEM target connection settings and secrets for peat forward"

# --- Elastic / OpenSearch -----------------------------------------------------
# Username/password are injected into elastic_server's userinfo at run time, so
# you do NOT need to percent-encode special characters into the URL yourself.
elastic_server: "https://es.example.com:9200/"
elastic_user: "peat_writer"
elastic_password: !ENV "ELASTIC_PASSWORD"   # export ELASTIC_PASSWORD=... before the run

# --- Malcolm ------------------------------------------------------------------
# The "/mapi/opensearch" path is auto-appended if you omit it. If malcolm_user /
# malcolm_password are unset, PEAT falls back to elastic_user / elastic_password.
malcolm_server: "https://malcolm.example.com/"
malcolm_user: "analyst"
malcolm_password: !ENV "MALCOLM_PASSWORD"

# --- Security Onion -----------------------------------------------------------
# so_auth=basic uses so_user / so_password. For production prefer an API key
# (so_auth: apikey + so_api_key) over the so_elastic superuser.
so_server: "https://so-manager.example.com:9200/"
so_auth: "basic"
so_user: "so_elastic"
so_password: !ENV "SO_PASSWORD"
# so_auth: "apikey"
# so_api_key: !ENV "SO_API_KEY"          # "id:api_key" form
# so_ca_cert: "/etc/ssl/certs/so-ca.pem" # verify SO's TLS cert
# so_insecure: false                     # set true only for self-signed lab certs
